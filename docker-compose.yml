services:
  # ==========================================
  # DỊCH VỤ 1: KHO LƯU TRỮ OBJECT (MINIO)
  # ==========================================
  minio:
    image: quay.io/minio/minio
    container_name: minio_datalake
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file:
      - .env
    volumes:
      - ./docker/minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped

  # ==========================================
  # DỊCH VỤ 2: CƠ SỞ DỮ LIỆU (POSTGRESQL)
  # ==========================================
  postgres:
    image: postgres:16
    container_name: postgres_warehouse
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - ./docker/db/pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ==========================================
  # DỊCH VỤ 3: SQL VÀ DASHBOARD (METABASE)
  # ==========================================
  metabase:
    image: metabase/metabase:v0.63.19
    pull_policy: missing
    container_name: metabase
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      JAVA_TIMEZONE: Asia/Bangkok
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 5
    restart: unless-stopped

volumes:
  # Giữ tên volume đã dùng trong lệnh docker run trước đó.
  metabase_data:
    name: metabase_data
